version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: hum_research_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hum_research
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: user
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hum_research"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: